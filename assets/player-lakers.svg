<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#552583"/>
      <stop offset="55%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0414"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#a67c52"/>
    </linearGradient>
  </defs>
  <rect width="360" height="480" rx="28" fill="url(#bg)"/>
  <ellipse cx="180" cy="130" rx="150" ry="130" fill="url(#halo)"/>
  <!-- body / jersey -->
  <path d="M108 250 Q180 210 252 250 L268 400 Q180 430 92 400 Z" fill="#552583"/>
  <path d="M130 248 L145 400 M230 248 L215 400" stroke="#ddd6fe" stroke-width="3.5"/>
  <text x="180" y="325" text-anchor="middle" fill="#ddd6fe" font-family="Arial Black, sans-serif" font-size="72" font-weight="900">23</text>
  <!-- neck -->
  <rect x="162" y="198" width="36" height="28" rx="8" fill="url(#skin)"/>
  <!-- head -->
  <ellipse cx="180" cy="155" rx="52" ry="58" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M128 145 Q130 95 180 88 Q230 95 232 145 Q220 118 180 112 Q140 118 128 145 Z" fill="#1a1020"/>
  <ellipse cx="180" cy="118" rx="48" ry="22" fill="#1a1020"/>
  <!-- face -->
  <ellipse cx="160" cy="155" rx="5" ry="6" fill="#2a1810"/>
  <ellipse cx="200" cy="155" rx="5" ry="6" fill="#2a1810"/>
  <path d="M168 178 Q180 186 192 178" stroke="#5c3d2e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- beard hint -->
  <path d="M148 170 Q180 205 212 170" fill="#2a1810" opacity=".35"/>
  <!-- arms -->
  <path d="M108 260 Q70 300 78 360" stroke="url(#skin)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M252 260 Q300 290 290 350" stroke="url(#skin)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- ball -->
  <circle cx="78" cy="370" r="22" fill="#c4b5fd"/>
  <path d="M60 370 H96 M78 352 V388 M66 358 Q78 370 90 382 M90 358 Q78 370 66 382" stroke="#1a0a00" stroke-width="1.5" opacity=".5"/>
  <text x="180" y="448" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">JAMES</text>
  <text x="180" y="468" text-anchor="middle" fill="#A78BFA" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">LAKERS · SF</text>
</svg>
