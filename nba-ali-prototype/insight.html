<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NBA × HappyOyster · 用户洞察</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0d;
    --yellow: #f0c14b;
    --coral: #e87878;
    --lavender: #c4b0e8;
    --blue: #8ec5f0;
    --blue-tab: #3d6fa8;
    --mint: #9fd4a8;
    --mint-tab: #3d8a55;
    --orange: #f5a623;
    --ink: #111;
    --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: var(--font);
    min-height: 100vh;
    padding: 40px 48px 64px;
  }
  .eyebrow {
    font-size: 15px; font-weight: 700; margin-bottom: 14px;
  }
  .eyebrow .brand { color: var(--orange); }
  h1 {
    font-size: clamp(28px, 3.2vw, 42px);
    font-weight: 900;
    line-height: 1.35;
    letter-spacing: 0.01em;
    max-width: 920px;
    margin-bottom: 36px;
  }
  .grid {
    display: grid;
    grid-template-columns: minmax(280px, 1.05fr) minmax(420px, 1.35fr);
    gap: 28px 36px;
    align-items: start;
    max-width: 1180px;
  }
  @media (max-width: 900px) {
    body { padding: 24px 16px 48px; }
    .grid { grid-template-columns: 1fr; }
  }
  .insights { display: flex; flex-direction: column; gap: 18px; }
  .insight {
    border-radius: 22px;
    padding: 22px 26px;
    color: var(--ink);
  }
  .insight.y { background: var(--yellow); }
  .insight.c { background: var(--coral); }
  .insight.p { background: var(--lavender); }
  .insight h2 {
    font-size: clamp(20px, 2.2vw, 28px);
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: 0.01em;
  }
  .insight p {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.55;
    opacity: 0.92;
  }

  .folders {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    position: relative;
  }
  @media (max-width: 600px) { .folders { grid-template-columns: 1fr; } }

  .folder {
    position: relative;
    border-radius: 0 18px 18px 18px;
    padding: 18px 14px 16px;
    min-height: 340px;
    display: flex; flex-direction: column;
  }
  .folder::before {
    content: "";
    position: absolute;
    top: -18px; left: 0;
    width: 42%; height: 22px;
    border-radius: 12px 12px 0 0;
  }
  .folder.blue { background: var(--blue); }
  .folder.blue::before { background: var(--blue-tab); }
  .folder.green { background: var(--mint); }
  .folder.green::before { background: var(--mint-tab); }

  .tape {
    position: absolute;
    top: -10px; left: 18%;
    width: 48px; height: 18px;
    border-radius: 3px;
    transform: rotate(-8deg);
    opacity: 0.95;
    z-index: 2;
  }
  .folder.blue .tape { background: #f0c14b; }
  .folder.green .tape { background: #e85d5d; }

  .illu {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 4px;
  }
  .illu svg { width: 100%; max-width: 240px; height: auto; }
  .folder-label {
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: var(--ink);
    padding-top: 6px;
  }

  .phone-wrap {
    grid-column: 1 / -1;
    display: flex; justify-content: center;
    margin-top: -28px;
    position: relative;
    z-index: 3;
  }
  .phone {
    width: 160px;
    background: #111;
    border-radius: 22px;
    border: 3px solid #2a2a2a;
    padding: 10px 8px 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    position: relative;
  }
  .phone .notch {
    width: 48px; height: 6px; border-radius: 4px;
    background: #333; margin: 0 auto 8px;
  }
  .phone-screen {
    border-radius: 12px;
    overflow: hidden;
    background: #1a0a2e;
    aspect-ratio: 9/14;
    position: relative;
  }
  .phone-screen svg { width: 100%; height: 100%; display: block; }
  .float {
    position: absolute;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #fff;
    display: grid; place-items: center;
    font-size: 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  .float.a { top: 18%; left: -28px; }
  .float.b { top: 42%; right: -30px; font-weight: 900; color: #333; }
  .float.c { bottom: 22%; left: -22px; }
  .float.d { bottom: 8%; right: -18px; width: 40px; height: 40px; overflow: hidden; padding: 0; }

  .links {
    margin-top: 40px; font-size: 13px; color: #888;
  }
  .links a { color: #a78bfa; }
</style>
</head>
<body>
  <div class="eyebrow"><span class="brand">NBA × HappyOyster</span> / 用户洞察</div>
  <h1>追球队或球星、主要远程观赛的 NBA 中国球迷</h1>

  <div class="grid">
    <div class="insights">
      <article class="insight y">
        <h2>关注固定的球队或球星</h2>
        <p>喜欢的球队或球星，是他们持续关注 NBA 的动力。</p>
      </article>
      <article class="insight c">
        <h2>离赛场远，难以到场</h2>
        <p>平时主要隔屏看球，少有机会感受现场气氛。</p>
      </article>
      <article class="insight p">
        <h2>难以看完整场，利用空档追赛</h2>
        <p>常在午休、通勤等碎片时间查比分、补看集锦。</p>
      </article>
    </div>

    <div class="folders">
      <!-- Folder: 隔屏观赛 -->
      <div class="folder blue">
        <div class="tape" aria-hidden="true"></div>

            <circle cx="118" cy="158" r="6" fill="#a78bfa"/>

            <!-- grey hair -->
            <path d="M34 118 Q36 106 48 104 Q60 106 62 118 Q56 110 48 110 Q40 110 34 118 Z" fill="#9e9e9e"/>
            <circle cx="43" cy="122" r="1.8" fill="#333"/>
            <circle cx="53" cy="122" r="1.8" fill="#333"/>
            <path d="M44 129 Q48 132 52 129" stroke="#c49a6c" stroke-width="1.2" fill="none"/>
            <!-- legs -->
            <path d="M38 172 Q42 188 36 198" stroke="#3949ab" stroke-width="8" stroke-linecap="round"/>
            <path d="M56 172 Q60 188 66 196" stroke="#3949ab" stroke-width="8" stroke-linecap="round"/>
            <!-- person sitting floor right -->
            <ellipse cx="200" cy="178" rx="22" ry="10" fill="#455a64"/>
            <ellipse cx="200" cy="160" rx="15" ry="18" fill="#26a69a"/>
            <circle cx="200" cy="132" r="13" fill="#e8b896"/>
            <path d="M187 128 Q188 116 200 114 Q212 116 213 128 Q208 120 200 120 Q192 120 187 128 Z" fill="#5d4037"/>
            <circle cx="195" cy="132" r="1.6" fill="#333"/>
            <circle cx="205" cy="132" r="1.6" fill="#333"/>
            <path d="M196 138 Q200 141 204 138" stroke="#b8956c" stroke-width="1.1" fill="none"/>
            <!-- arms holding phone -->
            <path d="M185 155 Q170 150 168 142" stroke="#e8b896" stroke-width="6" stroke-linecap="round"/>
            <rect x="160" y="132" width="14" height="22" rx="3" fill="#212121"/>
            <rect x="162" y="134" width="10" height="16" rx="1" fill="#7c4dff"/>
          </svg>
        </div>
        <div class="folder-label">隔屏观赛</div>
      </div>

      <!-- Folder: 喜欢固定球星 -->
      <div class="folder green">
        <div class="tape" aria-hidden="true"></div>
        <div class="illu">
          <svg viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg" aria-label="喜欢固定球星插画">
            <ellipse cx="130" cy="205" rx="95" ry="12" fill="#6db87a" opacity=".4"/>
            <!-- giant phone -->
            <rect x="95" y="28" width="100" height="170" rx="14" fill="#1a1a1a"/>
            <rect x="102" y="40" width="86" height="146" rx="6" fill="#fafafa"/>
            <!-- profile on phone -->
            <circle cx="145" cy="78" r="22" fill="#f5d0a9"/>
            <path d="M125 72 Q128 55 145 52 Q162 55 165 72 Q158 62 145 62 Q132 62 125 72 Z" fill="#3e2723"/>
            <circle cx="138" cy="78" r="2" fill="#333"/>
            <circle cx="152" cy="78" r="2" fill="#333"/>

            <path d="M178 58 C178 52 186 52 186 58 C186 52 194 52 194 58 C194 68 186 74 186 74 C186 74 178 68 178 58 Z" fill="#e91e63"/>

            <ellipse cx="48" cy="175" rx="18" ry="8" fill="#558b2f"/>
            <path d="M32 140 Q48 128 64 140 L68 175 Q48 185 28 175 Z" fill="#66bb6a"/>
            <circle cx="48" cy="118" r="16" fill="#f5d0a9"/>
            <path d="M32 114 Q34 98 48 96 Q62 98 64 114 Q58 104 48 104 Q38 104 32 114 Z" fill="#4e342e"/>
            <circle cx="42" cy="118" r="2" fill="#333"/>
            <circle cx="54" cy="118" r="2" fill="#333"/>
            <path d="M43 126 Q48 130 53 126" stroke="#c49a6c" stroke-width="1.3" fill="none"/>
            <!-- arm pointing -->
            <path d="M64 145 Q85 140 100 130" stroke="#f5d0a9" stroke-width="8" stroke-linecap="round"/>
            <!-- person right dark -->
            <ellipse cx="220" cy="180" rx="16" ry="7" fill="#37474f"/>
            <path d="M206 148 Q220 138 234 148 L236 178 Q220 188 204 178 Z" fill="#263238"/>
            <circle cx="220" cy="128" r="14" fill="#e8b896"/>
            <path d="M206 124 Q208 110 220 108 Q232 110 234 124 Q228 116 220 116 Q212 116 206 124 Z" fill="#212121"/>
            <circle cx="215" cy="128" r="1.8" fill="#333"/>
            <circle cx="225" cy="128" r="1.8" fill="#333"/>
            <path d="M216 135 Q220 138 224 135" stroke="#b8956c" stroke-width="1.1" fill="none"/>
            <path d="M206 155 Q185 150 175 145" stroke="#e8b896" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="folder-label">喜欢固定的球星球队</div>
      </div>
    </div>

    <div class="phone-wrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="phone-screen">
          <svg viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg">
            <rect width="180" height="280" fill="#12081f"/>
            <ellipse cx="90" cy="200" rx="70" ry="28" fill="#2e1065" opacity=".6"/>
            <ellipse cx="90" cy="200" rx="55" ry="18" stroke="#7c3aed" stroke-width="1.5" fill="none" opacity=".5"/>

            <circle cx="95" cy="95" r="16" fill="#f5d0a9"/>
            <path d="M82 90 Q84 78 95 76 Q106 78 108 90" fill="#1a1020"/>
            <path d="M78 115 Q95 105 112 118 L118 170 Q95 185 72 168 Z" fill="#552583"/>
            <text x="95" y="148" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="900" font-family="sans-serif">23</text>
            <path d="M112 120 Q140 90 145 70" stroke="#f5d0a9" stroke-width="10" stroke-linecap="round"/>
            <circle cx="148" cy="58" r="12" fill="#c4b5fd"/>

            <path d="M78 120 Q55 150 50 180" stroke="#f5d0a9" stroke-width="9" stroke-linecap="round"/>

        </div>
        <div class="float a">💬</div>
        <div class="float b">#</div>
        <div class="float c">📍</div>
        <div class="float d">
          <svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="20" fill="#7c3aed"/><circle cx="20" cy="16" r="7" fill="#f5d0a9"/><ellipse cx="20" cy="32" rx="10" ry="8" fill="#312e81"/></svg>
        </div>
      </div>
    </div>
  </div>

  <p class="links">

</body>
